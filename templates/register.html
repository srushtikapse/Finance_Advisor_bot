{% extends "base.html" %}{% block content %}
<div class="card auth"><h1>Create account</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Full name<input name="full_name"></label>
<label>Email<input type="email" name="email" required></label>
<label>Password (min 8 chars)<input type="password" name="password" minlength="8" required></label>
<button class="btn">Register</button></form>
<p>Have an account? <a href="{{ url_for('login') }}">Log in</a></p></div>{% endblock %}
